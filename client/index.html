<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="oBP_hajuskaIet9Ke1e21DopvVX6edes2bT2W1v7tL0" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      ⚠️ Title, meta description, canonical, keywords et Open Graph
      title/description/url ont été retirés d'ici volontairement.
      Ils sont désormais gérés exclusivement par react-helmet-async :
      - DefaultSEO.jsx fournit les valeurs par défaut (homepage)
      - Chaque page (Home, ProductDetail, BlogPost...) fournit ses
        propres valeurs via son propre <Helmet>, qui écrase le défaut.
      Garder ces balises ici causait un doublon (deux <title>,
      deux canonical) sur chaque page qui a son propre Helmet.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Peptides Weight Loss" />

    <!-- Open Graph / Facebook - valeurs techniques restantes, non dupliquées par Helmet -->
    <meta property="og:site_name" content="Peptides Weight Loss" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card - technique, non géré par Helmet actuellement -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#0f172a" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JXL9SKEHCT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JXL9SKEHCT');
    </script>

    <!-- Ahrefs Web Analytics -->
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="SxeqMvre7LD56hnoH+FSMw" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
